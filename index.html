<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il mio primo sito</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #d1fae5;
      color: #1e293b;
      text-align: center;
      padding: 60px 20px;
    }
    .card {
      max-width: 600px;
      margin: 30px auto;
      padding: 40px 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 { color: #4f46e5; }
    p { line-height: 1.7; }
    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 22px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
    .button:hover { background: #3730a3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌻Piante e semi da Samuel🌻</h1>
    <p>Acquisto i vostri semi di piante medicinali.</p>
  </div>
</body>
</html>
